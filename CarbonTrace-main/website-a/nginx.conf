server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Allow up to 50MB uploads (covers PDF + image files for IPFS pinning)
    client_max_body_size 50M;

    # Serve React SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to backend — with generous timeouts for Pinata uploads
    location /api {
        proxy_pass http://backend:5001;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Timeouts — Pinata uploads can take up to 60s for large files
        proxy_connect_timeout       60s;
        proxy_send_timeout          120s;
        proxy_read_timeout          120s;
        send_timeout                120s;

        # Don't buffer request body — stream directly to backend
        # Critical for large file uploads to avoid 413 from nginx buffering
        proxy_request_buffering     off;
        proxy_buffering             off;
    }
}
